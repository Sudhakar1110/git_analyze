{% extends "git_analyze/templates/pages/portal.html" %}

{% block page_content %}
{% set active_page = "settings" %}

<div class="ga-page-header">
    <div>
        <h1 class="ga-page-title">Settings</h1>
        <p class="ga-page-subtitle">Configure API keys and analysis preferences.</p>
    </div>
</div>

<div class="ga-card ga-card-lg">
    <div class="ga-card-header">
        <h3 class="ga-card-title">API Configuration</h3>
    </div>
    <div class="ga-card-body">
        <form id="settings-form" class="ga-form">
            <div class="ga-form-group">
                <label class="ga-label">Groq API Key <span class="ga-required">*</span></label>
                <div class="ga-input-wrapper">
                    <svg class="ga-input-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="9" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 9V6C6 3.79086 7.79086 2 10 2C12.2091 2 14 3.79086 14 6V9" stroke="currentColor" stroke-width="1.5"/></svg>
                    <input type="password" id="groq-api-key" name="groq_api_key" class="ga-input" placeholder="Enter your Groq API key" value="{{ groq_key or '' }}">
                </div>
                <span class="ga-hint">Get your free API key from <a href="https://console.groq.com" target="_blank">console.groq.com</a></span>
            </div>

            <div class="ga-form-row">
                <div class="ga-form-group">
                    <label class="ga-label">Groq Model</label>
                    <select id="groq-model" name="groq_model" class="ga-input ga-select">
                        <option value="llama3-8b-8192" {% if settings and settings.groq_model == 'llama3-8b-8192' %}selected{% endif %}>LLaMA 3 8B (Fast, Free)</option>
                        <option value="llama3-70b-8192" {% if settings and settings.groq_model == 'llama3-70b-8192' %}selected{% endif %}>LLaMA 3 70B (Advanced)</option>
                        <option value="mixtral-8x7b-32768" {% if settings and settings.groq_model == 'mixtral-8x7b-32768' %}selected{% endif %}>Mixtral 8x7B (Balanced)</option>
                    </select>
                </div>
                <div class="ga-form-group">
                    <label class="ga-label">Max Files to Analyze</label>
                    <input type="number" id="max-files" name="max_files_limit" class="ga-input" value="{{ settings.max_files_limit or 50 }}" min="10" max="500">
                </div>
            </div>

            <div class="ga-form-row">
                <div class="ga-form-group">
                    <label class="ga-label">Output Language</label>
                    <select id="output-language" name="output_language" class="ga-input ga-select">
                        <option value="English" {% if settings and settings.output_language == 'English' %}selected{% endif %}>English</option>
                        <option value="Spanish" {% if settings and settings.output_language == 'Spanish' %}selected{% endif %}>Spanish</option>
                        <option value="French" {% if settings and settings.output_language == 'French' %}selected{% endif %}>French</option>
                        <option value="German" {% if settings and settings.output_language == 'German' %}selected{% endif %}>German</option>
                    </select>
                </div>
                <div class="ga-form-group">
                    <label class="ga-label">GitHub Token (Optional)</label>
                    <input type="password" id="github-token" name="github_token" class="ga-input" placeholder="For private repos" value="{{ github_token or '' }}">
                </div>
            </div>

            <div class="ga-form-actions">
                <button type="submit" class="ga-btn ga-btn-primary">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13 3L6 14L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Save Settings
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
