{% from "git_analyze/templates/pages/macros.html" import ga_sidebar, ga_scripts %}
<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings - Git Analyzer</title></head>
<body>
<div class="ga-portal">
{{ ga_sidebar('settings') }}
<main class="ga-main-content">
<div class="ga-content-wrapper">
<div class="ga-page-header"><div><h1 class="ga-page-title">Settings</h1><p class="ga-page-subtitle">Configure API keys and analysis preferences.</p></div></div>
<div class="ga-card" style="max-width:800px"><div class="ga-card-header"><h3 class="ga-card-title">API Configuration</h3></div><div class="ga-card-body">
<form id="settings-form" onsubmit="saveSettings(event)">
<div style="margin-bottom:20px"><label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Groq API Key <span style="color:#ef4444">*</span></label><input type="password" id="groq-api-key" class="ga-input" placeholder="Enter your Groq API key" value="{{ groq_key or '' }}" style="width:100%;padding:10px 14px;border:1px solid var(--ga-border);border-radius:var(--ga-radius-sm);font-size:14px;font-family:inherit"><span style="font-size:12px;color:var(--ga-text-lighter)">Get your free API key from <a href="https://console.groq.com" target="_blank" style="color:var(--ga-primary);text-decoration:none">console.groq.com</a></span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px"><div><label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Groq Model</label><select id="groq-model" class="ga-input" style="width:100%;padding:10px 14px;border:1px solid var(--ga-border);border-radius:var(--ga-radius-sm);font-size:14px;font-family:inherit"><option value="llama3-8b-8192" {% if settings and settings.groq_model=='llama3-8b-8192' %}selected{% endif %}>LLaMA 3 8B (Fast, Free)</option><option value="llama3-70b-8192" {% if settings and settings.groq_model=='llama3-70b-8192' %}selected{% endif %}>LLaMA 3 70B (Advanced)</option><option value="mixtral-8x7b-32768" {% if settings and settings.groq_model=='mixtral-8x7b-32768' %}selected{% endif %}>Mixtral 8x7B (Balanced)</option></select></div><div><label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Max Files to Analyze</label><input type="number" id="max-files" class="ga-input" value="{{ settings.max_files_limit or 50 }}" min="10" max="500" style="width:100%;padding:10px 14px;border:1px solid var(--ga-border);border-radius:var(--ga-radius-sm);font-size:14px;font-family:inherit"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px"><div><label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Output Language</label><select id="output-language" class="ga-input" style="width:100%;padding:10px 14px;border:1px solid var(--ga-border);border-radius:var(--ga-radius-sm);font-size:14px;font-family:inherit"><option value="English" {% if settings and settings.output_language=='English' %}selected{% endif %}>English</option><option value="Spanish" {% if settings and settings.output_language=='Spanish' %}selected{% endif %}>Spanish</option><option value="French" {% if settings and settings.output_language=='French' %}selected{% endif %}>French</option><option value="German" {% if settings and settings.output_language=='German' %}selected{% endif %}>German</option></select></div><div><label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">GitHub Token (Optional)</label><input type="password" id="github-token" class="ga-input" placeholder="For private repos" value="{{ github_token or '' }}" style="width:100%;padding:10px 14px;border:1px solid var(--ga-border);border-radius:var(--ga-radius-sm);font-size:14px;font-family:inherit"></div></div>
<div style="display:flex;justify-content:flex-end;gap:12px;margin-top:8px"><button type="submit" class="ga-btn ga-btn-primary">Save Settings</button></div>
</form>
</div></div>
</div></main></div>
{{ ga_scripts() }}
</body></html>
